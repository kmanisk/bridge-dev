name: portable-platforms

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/test-portable-runtime.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/portable-platforms.yml'
  workflow_dispatch:

jobs:
  portable:
    name: portable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test:portable
