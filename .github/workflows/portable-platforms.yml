name: portable-platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: portable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test:portable
      - run: pnpm run test:portable:server
      - run: pnpm run test:trial
      - run: pnpm run test:cli
      - run: node scripts/test-install-portable.mjs
      - run: pnpm run test:extensions
  sources:
    name: Linux source and supply chain fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:sources
      - run: pnpm run test:integration
      - name: Clean portable install from actual source
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          export BRIDGEDEV_INSTALL_ROOT="$root/runtime"
          export BRIDGEDEV_INSTALL_CONFIG="$root/config"
          export BRIDGEDEV_INSTALL_BIN="$root/bin"
          export BRIDGEDEV_INSTALL_WORKSPACE="$root/workspace"
          node scripts/install-portable.mjs --source .
          test -f "$root/config/.env"
          test -x "$root/bin/bridge-dev"
          "$root/bin/bridge-dev" help >/dev/null
