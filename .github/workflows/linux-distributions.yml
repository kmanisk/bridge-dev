name: linux-distributions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    name: portable / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['node:24-bookworm', 'fedora:latest', 'archlinux:latest']
    container:
      image: ${{ matrix.image }}
      options: --init
    steps:
      - name: Prepare disposable container runtime
        shell: bash
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y nodejs npm git tar gzip
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm nodejs npm git tar gzip
          fi
          npm install --global pnpm@12 --ignore-scripts
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test:portable
      - run: pnpm run test:portable:server
      - run: pnpm run test:extensions
