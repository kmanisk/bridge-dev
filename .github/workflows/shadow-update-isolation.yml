name: shadow-update-isolation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bubblewrap-security-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare disposable CI namespace tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap iproute2
          command -v bwrap
          command -v ip
      - name: Install locked dependencies and build
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Verify unprivileged namespace baseline
        run: |
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - name: Exercise real unprivileged shadow isolation and negative MCP acceptance
        run: node scripts/test-shadow-linux-e2e.mjs
      # The full test:all suite also includes host-managed chezmoi, fish, Sway,
      # and system-context assertions requiring the operator workstation.
      # Those are not silently simulated on a portable GitHub runner.
      # Execute every hosted security/portable/integration suite explicitly.
      - name: Run hosted policy, CLI, extensions, integration and portable suites
        run: |
          pnpm run test:policy
          pnpm run test:cli
          pnpm run test:extensions
          pnpm run test:integration
          pnpm run test:portable
          pnpm run test:portable:server
          pnpm run test:sources
          node scripts/sync-tool-counts.mjs --check-manifest profiles/native-tool-counts.json
