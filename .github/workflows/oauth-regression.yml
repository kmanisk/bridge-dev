name: OAuth consent regression (temporary)
on:
  push:
    branches: [fix/oauth-consent-replay]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format verified Go changes on test branch
        run: |
          gofmt -w internal/auth/oauth.go internal/auth/clients.go internal/auth/terminal.go internal/auth/terminal_test.go internal/auth/terminal_browser_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/auth/oauth.go internal/auth/clients.go internal/auth/terminal.go internal/auth/terminal_test.go internal/auth/terminal_browser_test.go
            git commit -m "style(auth): format consent fix and regression tests"
            git push origin HEAD:fix/oauth-consent-replay
          fi
      - name: OAuth focused tests
        run: go test -count=1 ./internal/auth ./internal/transport
      - name: OAuth race tests
        run: go test -race -count=1 ./internal/auth ./internal/transport
      - name: Full regression and vet
        run: go vet ./... && go test -count=1 ./...
      - name: Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Verify clean Go formatting
        run: test -z "$(gofmt -l internal/auth/oauth.go internal/auth/terminal.go internal/auth/terminal_test.go internal/auth/clients.go internal/auth/terminal_browser_test.go)"
