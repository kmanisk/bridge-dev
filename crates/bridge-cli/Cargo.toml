[package]
name = "bridge-cli"
version = "0.1.0"
edition = "2021"
description = "BridgeDev command line interface binary in Rust"

[dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
